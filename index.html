<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Clone - Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100">
  <!-- Header -->
  <div id="header"></div>

  <!-- Main content -->
  <div class="flex">
    <!-- Sidebar -->
    <div id="sidebar" class="hidden md:block w-64 bg-white h-screen shadow-md"></div>

    <!-- Video grid -->
    <main class="flex-1 p-4">
      <h1 class="text-2xl font-semibold mb-4">Recommended Videos</h1>
      <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>

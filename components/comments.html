<div class="space-y-4">
  <h2 class="text-lg font-semibold mb-2">Comments</h2>
  <div id="comments-list" class="space-y-4 max-h-96 overflow-y-auto">
    <!-- Comments will be dynamically inserted here -->
  </div>
  <form id="comment-form" class="mt-4 flex space-x-2">
    <input
      type="text"
      id="comment-input"
      placeholder="Add a public comment..."
      class="flex-1 border border-gray-300 rounded-full py-2 px-4 focus:outline-none focus:ring-2 focus:ring-red-600"
      required
    />
    <button type="submit" class="bg-red-600 text-white rounded-full px-4 py-2 hover:bg-red-700 transition">
      Comment
    </button>
  </form>
</div>

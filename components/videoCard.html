<div class="bg-white rounded-lg shadow-md overflow-hidden cursor-pointer hover:shadow-lg transition-shadow duration-300">
  <a href="video.html?id={{videoId}}">
    <img src="{{thumbnail}}" alt="{{title}}" class="w-full h-48 object-cover" />
    <div class="p-3">
      <h3 class="text-sm font-semibold text-gray-900 mb-1 truncate">{{title}}</h3>
      <p class="text-xs text-gray-600">{{channel}}</p>
      <p class="text-xs text-gray-600">{{views}} views • {{uploaded}}</p>
    </div>
  </a>
</div>

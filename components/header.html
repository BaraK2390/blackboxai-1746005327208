<header class="bg-white shadow-md p-4 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center space-x-4">
    <button id="menu-button" class="text-gray-700 text-2xl md:hidden">
      <i class="fas fa-bars"></i>
    </button>
    <a href="index.html" class="text-red-600 text-3xl font-bold">YouTube</a>
  </div>
  <div class="flex-1 mx-4">
    <input
      type="text"
      id="search-input"
      placeholder="Search"
      class="w-full border border-gray-300 rounded-full py-2 px-4 focus:outline-none focus:ring-2 focus:ring-red-600"
    />
  </div>
  <div class="flex items-center space-x-4">
    <button class="text-gray-700 text-xl">
      <i class="fas fa-video"></i>
    </button>
    <button class="text-gray-700 text-xl">
      <i class="fas fa-bell"></i>
    </button>
    <button class="text-gray-700 text-xl rounded-full overflow-hidden w-8 h-8">
      <img src="https://i.pravatar.cc/40" alt="User Avatar" />
    </button>
  </div>
</header>

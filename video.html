<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Clone - Video Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100">
  <!-- Header -->
  <div id="header"></div>

  <div class="flex">
    <!-- Sidebar -->
    <div id="sidebar" class="hidden md:block w-64 bg-white h-screen shadow-md"></div>

    <!-- Video player and details -->
    <main class="flex-1 p-4 max-w-5xl mx-auto">
      <div id="video-player" class="mb-4">
        <!-- Video iframe will be inserted here -->
      </div>
      <h1 id="video-title" class="text-xl font-semibold mb-2"></h1>
      <p id="video-channel" class="text-gray-700 mb-4"></p>
      <div id="comments-section"></div>
    </main>
  </div>

  <script src="scripts/video.js"></script>
</body>
</html>
